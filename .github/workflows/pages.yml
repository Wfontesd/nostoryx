name: Publish Dev Labs to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate and build
        run: npm run ci

      - name: Publish static build to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="$(mktemp -d)"
          cp -R dist/. "$SITE_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R "$SITE_DIR"/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: NOSTORYX Dev Labs ${GITHUB_SHA}"
          git push --force origin gh-pages

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --request POST \
            --url "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/builds" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28"
